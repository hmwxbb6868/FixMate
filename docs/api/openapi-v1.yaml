  /api/v1/user/repair-requests/{id}/submit:
    post:
      tags: [RepairRequests]
      operationId: submitRepairRequest
      summary: 提交报修并执行高风险硬规则
      description: |
        流水线：表单完整性校验 → 文件归属复核 → 幂等 → 高风险硬规则筛查。

        命中硬规则返回 HTTP 422 `HardRuleBlockedResponse`。

        阶段 1 中五类高风险规则**同属最高紧急等级，不做严重度排序**：命中后一律阻断普通流程、
        创建安全事件与 `EMERGENCY` 工单、进入人工处理。`matchedRules[]` 是唯一事实源，
        包含全部命中规则及其完整固定指引，页面必须全部展示；任何单一规则不得覆盖或降低其他规则。
        同一幂等键重放返回同一 `safetyEventId` 与同一紧急工单。
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequestDTO'
      responses:
        '200':
          description: 提交成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponseBase'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/RepairRequestVO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '422':
          $ref: '#/components/responses/HardRuleBlocked'
        '500':
          $ref: '#/components/responses/InternalError'

