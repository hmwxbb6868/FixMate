components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      x-principal-type: CUSTOMER
      description: 客户微信令牌域；STAFF Web令牌不得进入客户接口。旧无域令牌只在原客户family剩余TTL内兼容。

    staffBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: STAFF Web域，严格校验签名、iss=fixmate、aud=fixmate-admin、principalType=STAFF、tokenUse=ACCESS、有效family及实时staff状态/credentialVersion。
      x-jwt-claims-schema:
        $ref: '#/components/schemas/StaffAccessTokenClaims'
      x-principal-type: STAFF
      x-audience: fixmate-admin
    employeeWechatBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: CUSTOMER微信登录JWT + 实时有效TECHNICIAN绑定；不是STAFF Web token。B签发新JWT带aud=fixmate-miniapp/principalType=CUSTOMER；原无域客户token只按原家族剩余TTL兼容，绝不可进入staffBearerAuth。
      x-principal-type: CUSTOMER
      x-audience: fixmate-miniapp

  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: true
      description: 请求追踪 ID，8–64 位字母、数字、下划线或连字符
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,64}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键，8–64 位字母、数字、下划线或连字符；重试必须复用同一值
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,64}$'
    IdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdString'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    OkEmpty:
      description: 成功，无业务数据（data 为 null）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessResponseBase'
              - type: object
                required: [data]
                properties:
                  data:
                    type: object
                    nullable: true
                    description: 服务端固定返回 null；OAS 3.0 无法表达"仅 null"的类型，运行时契约测试断言
    ValidationError:
      description: 参数校验失败（VALIDATION_ERROR）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    Unauthorized:
      description: 未登录、令牌失效或刷新令牌重放（UNAUTHORIZED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedResponse'
    Forbidden:
      description: 角色或资源归属不允许（FORBIDDEN）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenResponse'
    NotFound:
      description: 资源不存在（RESOURCE_NOT_FOUND）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundResponse'
    CommandConflict:
      description: 状态或版本冲突、幂等键冲突（STATE_CONFLICT / VERSION_CONFLICT / DUPLICATE_REQUEST）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandConflictResponse'
    QuoteCommandConflict:
      description: 报价命令冲突（QUOTE_NOT_CURRENT / STATE_CONFLICT / VERSION_CONFLICT / DUPLICATE_REQUEST）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuoteCommandConflictResponse'
    DuplicateRequest:
      description: 幂等键冲突：同键不同请求（DUPLICATE_REQUEST）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DuplicateRequestResponse'
    RateLimited:
      description: 请求过频（RATE_LIMITED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitedResponse'
    StorageUnavailable:
      description: OSS 不可用（STORAGE_UNAVAILABLE）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StorageUnavailableResponse'
    WechatUnavailable:
      description: 微信接口不可用（WECHAT_UNAVAILABLE）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WechatUnavailableResponse'
    HardRuleBlocked:
      description: 命中高风险硬规则（HARD_RULE_BLOCKED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HardRuleBlockedResponse'
    PhoneBindUnavailable:
      description: 微信手机号能力不可用（PHONE_BIND_UNAVAILABLE）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PhoneBindUnavailableResponse'
    InternalError:
      description: 服务器内部错误（INTERNAL_ERROR）；不返回堆栈、SQL 或密钥
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalErrorResponse'

  schemas:
    IdString:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      example: '1001'

    NonNegativeVersion:
      type: integer
      minimum: 0
      example: 3

    MoneyAmount:
      type: string
      pattern: '^[0-9]{1,10}\.[0-9]{2}$'
      description: DECIMAL(12,2)
      example: '380.00'

    Quantity:
      type: string
      pattern: '^(?:0\.(?!000$)[0-9]{3}|[1-9][0-9]{0,6}\.[0-9]{3})$'
      description: DECIMAL(10,3)，必须大于 0
      example: '1.000'

