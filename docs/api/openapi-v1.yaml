openapi: 3.0.3
info:
  title: 安心家电修 FixMate API
  version: 1.1.0
  description: |
    微信小程序与 Web 管理端的家电维修业务接口。

    ## 通用约定
    - 前缀 `/api/v1`，用户 `/user/**`、后台 `/admin/**`、微信维修工作区 `/technician/**`
    - 鉴权 `Authorization: Bearer <token>`；`wx-login`、`refresh`、`logout` 除外（logout 用请求体 Refresh Token 认证）
    - **所有写请求**（含登录、刷新、登出）必须携带 `X-Request-Id` 与 `Idempotency-Key`
    - 分页从 1 开始，默认 20，最大 100
    - Long 型 ID 为十进制正整数字符串；金额 `DECIMAL(12,2)`；数量 `DECIMAL(10,3)` 且必须大于 0
    - 时间返回 ISO-8601 带偏移
    - 成功响应 `code` 固定为 `OK`，且必定包含 `data`（无数据时为 null）

    ## 幂等作用域与执行顺序
    **幂等记录必须先绑定可信主体，再在主体范围内查询；未鉴权请求不得做全局幂等查询。**

    | 接口类别 | 幂等作用域 |
    |---|---|
    | 用户及微信维修受保护写 | `CUSTOMER + customerId + operationId + Idempotency-Key`（原用户存量命名空间保留，不复制已完成记录） |
    | STAFF后台受保护写 | `STAFF + staffId + operationId + Idempotency-Key` |
    | 用户refresh/logout | `CUSTOMER + tokenFamilyId + operationId + Idempotency-Key`（兼容原命名空间） |
    | staffRefresh/staffLogout | `STAFF + tokenFamilyId + operationId + Idempotency-Key` |
    | userWxLogin/staffLogin | `认证入口operationId + Idempotency-Key`；staffLogin还受账号哈希+IP限流，凭据哈希不替代限流 |

    **请求体哈希不参与作用域**，只用于命中记录后的一致性比较：先按作用域 + 幂等键定位记录，
    再比较请求哈希；一致则重放，不一致返回 `DUPLICATE_REQUEST`。若把哈希放进作用域，
    不同请求体会落到不同作用域，就永远检测不到冲突。

    执行顺序（全部写接口）：

    1. 先建立可信主体及域（CUSTOMER/STAFF或可验证的对应域token family），实时检查账号/绑定/分派；涉及敏感重放同样先授权；
    2. 在该作用域内按 `Idempotency-Key` + 请求体哈希查首次执行记录；
    3. 命中且请求体一致 → 直接重放首次结果（包括 200、409、422 等状态），不重复执行副作用；
    4. 命中但请求体不一致 → 409 `DUPLICATE_REQUEST`；
    5. 未命中 → 正常执行并记录结果。

    ## 敏感响应存储约束
    `userWxLogin`、`userRefreshToken`、`staffLogin`、`staffRefresh` 的幂等记录包含 Access/Refresh Token，必须：

    - 加密存储，仅幂等组件可读，禁止进入普通日志与审计明文；
    - 保留期取**较短窗口**，且绝不超过 Access Token 有效期；
    - token family 被撤销后，任何使用该 Refresh Token 的请求（包括同幂等键重试）一律返回
      401 `UNAUTHORIZED`，**不得返回令牌**。

    邀请明文响应 `issueStaffInvitation` 同样短期加密存储，复查ADMIN权限后才重放；列表/详情永不返回明文。

    工单B2-C写响应可能含完整服务联系资料、照片签名或服务事实，统一加密保存，TTL=min(900秒, Access有效期)；scope仍为主体+operationId+key，重放前复查账号/会话、当前分派或接管。预约响应同样按此保存；敏感GET和写响应均Cache-Control: no-store。

    ## STAFF认证、密码与限流规范（阶段2已批准）
    - staffLogin未知账号、错密码、停用或无Web登录资格均401及同一公开文案；不存在账号执行等价口令哈希验证，不返回403/404区分账号状态。
    - 登录所有尝试（含幂等重放）先受IP每分钟30次限制；账号规范化值的HMAC与IP组合15分钟5次失败、账号跨IP15分钟20次失败均冷却15分钟，未知账号执行同样计数；不永久锁号、不公开账号存在/锁定状态，触发统一429。
    - STAFF失败凭据和密码修改失败不向日志/审计写口令或哈希；公开错误不透露账户状态；内部审计保存原因代码。
    - 新建/修改/重置密码恰好6位ASCII数字，禁止与当前相同；修改校验原密码；重置仅另一ADMIN核实并给出原因，禁止自行走重置绕过旧口令。
    - 修改/重置成功递增credentialVersion并撤销目标全部STAFF token families；撤销令牌后的同键敏感重放不得返回令牌。微信绑定不自动删除，真实安全事件另行撤销绑定。
    - 初始/重置密码必须置passwordChangeRequired，新登录后仅允许改密/刷新/登出，改密成功需重新登录；没有其他ADMIN时用用户操作的受控离线恢复，不开放匿名重置端点。
    - 改密每账号15分钟最多5次原口令失败冷却15分钟，重置每ADMIN每小时最多10次；均429且独立审计；不记录密码，管理员经受控渠道交付临时密码。
    - staffBearerAuth严格验证JWT签名允许列表、iss=fixmate、aud=fixmate-admin、principalType=STAFF、tokenUse、family及实时账号状态/credentialVersion；没有aud或主体类型的令牌不能进入STAFF接口。
    - 原客户令牌兼容仅限CUSTOMER域及原family剩余TTL，不能放行后台；B切片新微信令牌须带aud=fixmate-miniapp/principalType=CUSTOMER，维修接口仍实时检查绑定。

    ## Refresh Token 语义
    - Refresh Token 单次使用，每次刷新签发新组合，旧 Token 立即失效（token family 轮换）；
    - **先执行上面的幂等重放，再做重放检测**：同一幂等键的正常网络重试直接重放，不触发撤销；
    - 仅当**不同幂等键**再次使用已消费的 Refresh Token 时，判定为重放，撤销整条 family 并返回 401；
    - family 被 logout 撤销或判定重放后，使用该 Refresh Token 一律返回 401 `UNAUTHORIZED`，
      即使命中幂等记录也不返回令牌。

    ## Logout 语义
    - 不走 Bearer 鉴权，改用请求体中的 Refresh Token 认证 token family；
    - 因此 Access Token 已被撤销后，客户端重试 logout 仍可正常得到结果；
    - family 已撤销时：同幂等键重试返回 200；不同幂等键返回 401 `UNAUTHORIZED`。

    ## 交叉字段校验（服务端强制）
    - 草稿阶段：所有字段可选；仅在字段已提供时校验一致性（品牌启用、型号属于该品牌、设备类型一致）
    - `submit` 阶段：症状 10–1000 字、五项安全答案、地址必填；`modelId` 与 `modelText` 至少一项
    - `occurredAt` 不得晚于当前时间
    - 改约 `startAt < endAt`，且 `startAt` 不早于当前时间

    ## 权限与版本控制
    - Web token 为 STAFF 域，微信 token 保留 CUSTOMER 域；staffId/customerId 不得因数字相同混用。
    - x-required-roles 是角色候选，还必须实时验证绑定、账号状态、分派/接管关系和资源范围。
    - 员工受保护幂等作用域为 principalType+principalId+operationId+key，请求哈希含方法、规范路径和请求体。
    - 员工敏感响应重放前复核当前资源权限；撤权/改派后不得从缓存返回旧客户资料。refresh/logout沿用原家族撤销语义。
    - 所有业务按钮以对应 allowedActions 为准，写入时锁内重查同样条件；管理员不能豁免检测和独立审批。
    - 写操作以数据库时间、版本、唯一约束和事务确定结果；未决请求保持原键，不伪造失败报修。
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发
tags:
  - name: Admin
  - name: Technician
  - name: UserExtensions
  - name: Auth
  - name: Files
  - name: Meta
  - name: Addresses
  - name: RepairRequests
  - name: WorkOrders
  - name: Quotes
security:
  - bearerAuth: []
paths:
  /api/v1/user/auth/wx-login:
    post:
      tags: [Auth]
      operationId: userWxLogin
      summary: 微信 code 登录
      description: 服务端调用微信 `code2Session` 换取 openid 后签发平台 JWT；`session_key` 不返回前端、不落普通日志。
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WxLoginDTO'
            example:
              code: '081Kq7Ga1XyZAb0Q2mHb1s2dkV3Kq7Gb'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponseBase'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenVO'
              example:
                code: OK
                message: success
                traceId: 01J9Z8Y6Q3K4M5N6P7R8S9T0V
                timestamp: '2026-10-31T10:30:00+08:00'
                data:
                  accessToken: eyJhbGciOiJIUzI1NiJ9.access
                  refreshToken: eyJhbGciOiJIUzI1NiJ9.refresh
                  expiresIn: 3600
                  user:
                    id: '1001'
                    nickname: 张三
                    avatarUrl: https://example.invalid/a.png
                    phone: null
                    phoneVerified: false
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/DuplicateRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/WechatUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/user/auth/bind-phone:
    post:
      tags: [Auth]
      operationId: userBindPhone
      summary: 绑定微信手机号（当前不可用）
      x-no-success-response: true
      description: |
        个人主体无法使用微信手机号快速验证。本版本该端点只返回 422 `PHONE_BIND_UNAVAILABLE`，不声明 200。
        主体变更为企业并开通能力后，需按 ADR 升版补充 200。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WxPhoneBindDTO'
      responses:
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DuplicateRequest'
        '422':
          $ref: '#/components/responses/PhoneBindUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/user/auth/refresh:
    post:
      tags: [Auth]
      operationId: userRefreshToken
      summary: 刷新令牌（单次轮换）
      description: 先幂等重放，再重放检测；只有不同幂等键复用旧 Refresh Token 才撤销 family。
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDTO'
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponseBase'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenVO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DuplicateRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/user/auth/logout:
    post:
      tags: [Auth]
      operationId: userLogout
      summary: 登出（撤销整个 token family）
      description: 用请求体 Refresh Token 认证；family 已撤销时同幂等键重试返回 200。
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDTO'
      responses:
        '200':
          $ref: '#/components/responses/OkEmpty'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DuplicateRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/user/files:
    post:
      tags: [Files]
      operationId: userUploadFile
      summary: 上传文件
      description: 服务端校验扩展名、MIME、Magic Number、大小与 SHA-256 后流式写入私有 OSS；新文件为 TEMP。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  enum: [REPAIR_MEDIA, NAME_PLATE, AUDIO, AVATAR]
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponseBase'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/FileAssetVO'
              example:
                code: OK
                message: success
                traceId: 01J9Z8Y6Q3K4M5N6P7R8S9T0V
                timestamp: '2026-10-31T10:31:00+08:00'
                data:
                  id: '90001'
                  url: https://fixmate-demo.example.com/temp/xxxx?Expires=1730000000
                  mimeType: image/jpeg
                  sizeBytes: 234567
                  sha256: 9f2c1e4b7a8d0c3b5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/user/repair-form-meta:
    get:
      tags: [Meta]
      operationId: getRepairFormMeta
      summary: 报修表单元数据
      description: |
        品牌仅返回 `status=ENABLED` 的品牌（海尔、美的、西门子）。
        型号仅返回：品牌启用、型号启用、且 `coverageStatus ∈ {REGISTERED, PENDING_SOURCE, COVERED}` 的记录。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponseBase'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/RepairFormMetaVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/user/addresses:
    get:
      tags: [Addresses]
      operationId: listAddresses
      summary: 本人地址列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponseBase'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AddressVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Addresses]
      operationId: createAddress
      summary: 新增地址
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateDTO'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponseBase'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AddressVO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/user/addresses/{id}:
    put:
      tags: [Addresses]
      operationId: updateAddress
      summary: 修改本人地址
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdateDTO'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponseBase'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AddressVO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Addresses]
      operationId: disableAddress
      summary: 停用本人地址
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableRequestDTO'
      responses:
        '200':
          $ref: '#/components/responses/OkEmpty'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/user/repair-requests/drafts:
    post:
      tags: [RepairRequests]
      operationId: createRepairDraft
      summary: 创建报修草稿（允许空草稿）
      description: 草稿允许所有字段缺失；一致性校验仅在字段已提供时执行；完整性校验只在 submit。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairDraftUpsertDTO'
            example:
              applianceType: AIR_CONDITIONER
              brandId: '1'
              modelId: '1'
              symptomDescription: 空调开机后出风口吹出的风不冷，已经持续两天
              safetyAnswers:
                smokeOrBurningSmell: false
                electricLeakage: false
                gasSmell: false
                suspectedRefrigerantLeak: false
                severeWaterIngress: false
              addressId: '5001'
      responses:
        '200':
          description: 草稿已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponseBase'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/RepairRequestVO'
              example:
                code: OK
                message: success
                traceId: 01J9Z8Y6Q3K4M5N6P7R8S9T0V
                timestamp: '2026-10-31T10:32:00+08:00'
                data:
                  id: '70001'
                  repairNo: RR2026103100001
                  status: DRAFT
                  applianceType: AIR_CONDITIONER
                  brandId: '1'
                  brandCode: HAIER
                  modelId: '1'
                  modelCode: KFR-35GW/JSD-AP
                  modelText: null
                  serialNumber: null
                  symptomDescription: 空调开机后出风口吹出的风不冷，已经持续两天
                  errorCodeText: null
